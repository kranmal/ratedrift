<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — Lendly</title>
    <meta name="robots" content="noindex" />
    <!--
      GitHub Pages serves this for any path it can't resolve. It is deliberately
      standalone rather than an app route: the root layout is a tab navigator,
      which renders its first tab for anything it has no trigger for, so a
      routed 404 would have shown the home screen under a 404 status.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --text: #000000;
        --text-secondary: #60646c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #000000;
          --text: #ffffff;
          --text-secondary: #b0b4ba;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 24px;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
      }
      p {
        margin: 0;
        font-size: 14px;
        color: var(--text-secondary);
      }
      a {
        margin-top: 8px;
        font-size: 14px;
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <h1>Page not found</h1>
    <p>That page doesn&rsquo;t exist.</p>
    <a href="/lendly/">Go to Lendly</a>
  </body>
</html>
